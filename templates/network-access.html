<form method="post" action="/wlan-vlans#network-$object_id" class="network-form">
    <input type="hidden" name="csrf" value="$csrf">
    <input type="hidden" name="id" value="$object_id">
    <input type="hidden" name="inactive" value="$inactive">
    <input type="hidden" name="access" value="$access_id">
    <fieldset>
      <label>Bezeichnung <input name="label" maxlength="120" value="$label"></label>
      <label>$password_label <input name="password" type="password" autocomplete="new-password" maxlength="512"$required></label>
      <label>Ziel-VLAN <select name="vlan">$options</select></label>
      <label>Notiz zum Zugang <textarea name="note" maxlength="4000" rows="2">$note</textarea></label>
      <button name="action" value="save">Zugang speichern</button>
    </fieldset>
</form>
