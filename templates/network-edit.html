<div class="network-editor">
  $saved
  <p class="muted">$detail</p>
  $credentials
  <details class="network-note"$note_open>
    <summary>Notiz</summary>
    <form method="post" action="/wlan-vlans#network-$object_id" class="network-form">
      <input type="hidden" name="csrf" value="$csrf">
      <input type="hidden" name="id" value="$object_id">
      <input type="hidden" name="inactive" value="$inactive">
      <label>Notiz zum Objekt <textarea name="note" maxlength="4000" rows="2">$note</textarea></label>
      <button name="action" value="note">Notiz speichern</button>
    </form>
  </details>
</div>
